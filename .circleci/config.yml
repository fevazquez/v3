version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:26
  playwright:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.1-noble

orbs:
  qlty-orb: qltysh/qlty-orb@0.0

jobs:
  build-and-test:
    executor: node
    steps:
      - checkout
      - restore_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run lint
      - run: npm run format:check
      - run:
          name: Unit tests with coverage
          command: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - qlty-orb/coverage_publish:
          files: coverage/lcov.info
      - run:
          name: Build site
          command: npm run build
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
      - persist_to_workspace:
          root: ~/project
          paths:
            - dist

  e2e:
    executor: playwright
    steps:
      - checkout
      - restore_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - attach_workspace:
          at: ~/project
      - run: npx playwright test
      - store_test_results:
          path: junit
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

  deploy:
    executor: node
    steps:
      - checkout
      - restore_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - attach_workspace:
          at: ~/project
      - run:
          name: Deploy to Cloudflare
          command: npx wrangler deploy

workflows:
  ci:
    jobs:
      - build-and-test
      - e2e:
          requires:
            - build-and-test
      - deploy:
          requires:
            - build-and-test
            - e2e
          filters:
            branches:
              only: main
